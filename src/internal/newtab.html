<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:">
  <title>New Tab</title>
  <link rel="stylesheet" href="internal.css">
  <style>
    .newtab { width: min(860px, calc(100% - 40px)); margin: 0 auto; padding: 11vh 0 70px; }
    .hero { display: grid; justify-items: center; text-align: center; }
    .hero .logo { width: 62px; height: 62px; border-radius: 20px; font-size: 22px; }
    .hero h1 { margin: 18px 0 6px; font-size: 30px; letter-spacing: -.04em; }
    .hero p { margin: 0; color: var(--muted); }
    .search { width: min(680px, 100%); height: 54px; margin-top: 30px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 18px; }
    .search input { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px; }
    .search button { width: 38px; height: 38px; border: 0; border-radius: 12px; background: var(--accent); color: white; }
    .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 28px; }
    .quick button { min-height: 92px; display: grid; align-content: center; gap: 7px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--text); }
    .quick button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(15,23,42,.08); }
    .quick strong { font-size: 14px; }
    .quick span { color: var(--muted); font-size: 11px; }
    .recent { margin-top: 36px; }
    .recent-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
    .recent-head h2 { margin: 0; font-size: 14px; }
    @media (max-width: 660px) { .quick { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <main class="newtab">
    <section class="hero">
      <div class="logo">LV</div>
      <h1>LongView Browser</h1>
      <p>Built for pages that never seem to end.</p>
      <form id="search" class="search card">
        <input id="query" autocomplete="off" autofocus placeholder="Search or enter an address">
        <button aria-label="Go">→</button>
      </form>
    </section>

    <section class="quick" aria-label="Quick links">
      <button data-url="https://chatgpt.com/"><strong>ChatGPT</strong><span>Long conversations</span></button>
      <button data-url="longview://benchmark/?turns=1000"><strong>Benchmark</strong><span>1,000 turns</span></button>
      <button data-url="longview://history/"><strong>History</strong><span>Recent pages</span></button>
      <button data-url="longview://settings/"><strong>Settings</strong><span>Performance modes</span></button>
    </section>

    <section class="recent">
      <div class="recent-head"><h2>Recent</h2><button id="all-history" class="ghost">View all</button></div>
      <div id="recent-list" class="list"></div>
    </section>
  </main>
  <script src="newtab.js"></script>
</body>
</html>
