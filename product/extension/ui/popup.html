<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LongView</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="mark">LV</div>
      <div><h1>LongView</h1><p id="host">Current page</p></div>
      <span id="status" class="pill idle">Idle</span>
    </header>

    <section class="metrics" aria-label="Segment states">
      <div><strong id="hot">0</strong><span>Hot</span></div>
      <div><strong id="warm">0</strong><span>Warm</span></div>
      <div><strong id="cold">0</strong><span>Cold</span></div>
      <div><strong id="segments">0</strong><span>Total</span></div>
    </section>

    <section class="details">
      <div><span>Adapter</span><strong id="adapter">—</strong></div>
      <div><span>Page length</span><strong id="screens">—</strong></div>
      <div><span>Velocity</span><strong id="velocity">—</strong></div>
      <div><span>Mode</span><strong id="mode">—</strong></div>
    </section>

    <div class="actions">
      <button id="toggle" class="primary">Enable on this page</button>
      <button id="diagnostics">Diagnostics</button>
      <button id="reindex">Re-index</button>
    </div>
    <button id="options" class="link">Settings and compatibility</button>
    <p id="message" role="status"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
