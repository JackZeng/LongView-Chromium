name: Package desktop browser

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: package:win-x64
            artifact: longview-windows-x64
          - os: macos-latest
            command: package:mac-x64
            artifact: longview-macos-x64
          - os: macos-latest
            command: package:mac-arm64
            artifact: longview-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/**
          if-no-files-found: error
