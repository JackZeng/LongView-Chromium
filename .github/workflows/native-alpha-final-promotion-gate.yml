name: native-alpha-final-promotion-gate

on:
  push:
    branches: ["agent/blink-native-cold-alpha"]
    paths:
      - ".github/workflows/native-alpha-final-promotion-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: native-alpha-final-promotion-gate
  cancel-in-progress: true

jobs:
  wait-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for the final full-source proof bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v0.4.0-blink-native-alpha.final'
          proof="$RUNNER_TEMP/native-proof-final"
          for attempt in $(seq 1 330); do
            rm -rf "$proof"
            mkdir -p "$proof"
            if gh release download "$tag" --dir "$proof" \
              --pattern 'native-cold-proof.json' \
              --pattern 'native-controller-proof.json' \
              --pattern 'BLINK_NATIVE_COLD.json' \
              --pattern 'BROWSER_BINARY_SHA256.txt' \
              --pattern 'PATCH_SHA256.txt' \
              --pattern 'args.gn.resolved.txt' \
              --pattern 'LONGVIEW_REPOSITORY_SHA.txt' \
              --pattern 'VERSION.txt' >/dev/null 2>&1; then
              break
            fi
            sleep 60
          done
          test -s "$proof/native-cold-proof.json"
          test -s "$proof/native-controller-proof.json"
          echo "PROOF_DIR=$proof" >> "$GITHUB_ENV"
          echo "NATIVE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Independently verify direct and controller proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, os
          root=Path(os.environ['PROOF_DIR'])
          direct=json.loads((root/'native-cold-proof.json').read_text())
          assert direct['before']>0,direct
          assert direct['detached']>0,direct
          assert direct['after']==0,direct
          assert direct['restored']>0,direct
          assert abs(direct['heightBefore']-direct['heightCold'])<=2.0,direct
          assert abs(direct['heightBefore']-direct['heightRestored'])<=2.0,direct
          controller=json.loads((root/'native-controller-proof.json').read_text())
          assert controller['segments']>=12,controller
          assert controller['cold']>0,controller
          assert controller['nativeCold']>0,controller
          assert controller['detachedLayoutObjects']>0,controller
          assert controller['zeroLayout']==controller['nativeCold'],controller
          metadata=json.loads((root/'BLINK_NATIVE_COLD.json').read_text())
          assert metadata['feature']=='LongViewSegmentLifecycle',metadata
          assert metadata['runtimeFeatureDefault']=='disabled',metadata
          for name in ('BROWSER_BINARY_SHA256.txt','PATCH_SHA256.txt','args.gn.resolved.txt','LONGVIEW_REPOSITORY_SHA.txt','VERSION.txt'):
              path=root/name
              assert path.is_file() and path.stat().st_size>0,name
          print(json.dumps({'direct':direct,'controller':controller},indent=2))
          PY
          target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${NATIVE_TAG}" --jq .target_commitish)"
          git fetch origin agent/blink-native-cold-alpha
          git merge-base --is-ancestor "$target" origin/agent/blink-native-cold-alpha
      - name: Squash-merge the proven Blink Native Alpha
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr list --head agent/blink-native-cold-alpha --base main --state open --json number --jq '.[0].number')"
          test -n "$pr"
          gh pr comment "$pr" --body "Both final native proofs passed: direct descendant LayoutObject detach/materialization and end-to-end LongView Controller native COLD. Release: **${NATIVE_TAG}**. The proof gate is merging this Alpha."
          gh pr merge "$pr" --squash \
            --subject 'Build the first Blink Native COLD macOS Alpha' \
            --body "Compile the exact pinned Chromium source with the LongView Blink behavior, prove actual descendant LayoutObject release/restoration and controller-driven native COLD while geometry remains stable, and publish the proof-carrying Apple Silicon Alpha."
