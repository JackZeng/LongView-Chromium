name: macos-blink-native-alpha-xlarge

on:
  push:
    branches: ["agent/blink-native-cold-alpha"]
    paths:
      - ".github/workflows/macos-blink-native-alpha-xlarge.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-blink-native-alpha-xlarge
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14-xlarge
    timeout-minutes: 360
    env:
      NINJA_SUMMARIZE_BUILD: "1"
      GOMA_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, prove, and package on larger Apple Silicon
        shell: bash
        run: bash tools/ci/build_macos_blink_native_alpha_v3.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LongView-Chromium-macOS-Blink-Native-Alpha-xlarge
          path: dist/macos-native-alpha-v3/**
          if-no-files-found: error
          retention-days: 30
      - name: Publish fixed-tag proof-carrying prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v0.4.0-blink-native-alpha.latest'
          version="$(cat dist/macos-native-alpha-v3/VERSION.txt)"
          gh release delete "$tag" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$tag" \
            dist/macos-native-alpha-v3/LongView-Chromium-macOS-arm64-Blink-Native-Alpha.zip \
            dist/macos-native-alpha-v3/SHA256SUMS.txt \
            dist/macos-native-alpha-v3/README-FIRST.txt \
            dist/macos-native-alpha-v3/VERSION.txt \
            dist/macos-native-alpha-v3/proof/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "LongView Chromium $version" \
            --notes "Full-source Apple Silicon Blink Native Alpha built on the larger runner. Proof assets verify descendant LayoutObject release and materialization. Ad-hoc signed and not notarized."
