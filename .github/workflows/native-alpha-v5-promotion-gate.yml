name: native-alpha-v5-promotion-gate

on:
  push:
    branches: ["agent/blink-native-cold-alpha"]
    paths:
      - ".github/workflows/native-alpha-v5-promotion-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Wait for final-v5 proof bundle
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          tag='v0.4.0-blink-native-alpha.final-v5'
          proof="$RUNNER_TEMP/native-proof-v5"
          for attempt in $(seq 1 330); do
            rm -rf "$proof";mkdir -p "$proof"
            if gh release download "$tag" --dir "$proof" \
              --pattern 'native-cold-proof.json' \
              --pattern 'native-controller-proof.json' \
              --pattern 'BLINK_NATIVE_COLD.json' \
              --pattern 'BROWSER_BINARY_SHA256.txt' \
              --pattern 'PATCH_SHA256.txt' \
              --pattern 'args.gn.resolved.txt' \
              --pattern 'LONGVIEW_REPOSITORY_SHA.txt' \
              --pattern 'VERSION.txt' >/dev/null 2>&1; then break; fi
            sleep 60
          done
          test -s "$proof/native-cold-proof.json"
          test -s "$proof/native-controller-proof.json"
          echo "PROOF_DIR=$proof" >> "$GITHUB_ENV"
          echo "NATIVE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Verify both real native proofs
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,os
          root=Path(os.environ['PROOF_DIR'])
          d=json.loads((root/'native-cold-proof.json').read_text())
          assert d['before']>0 and d['detached']>0 and d['after']==0 and d['restored']>0,d
          assert abs(d['heightBefore']-d['heightCold'])<=2 and abs(d['heightBefore']-d['heightRestored'])<=2,d
          c=json.loads((root/'native-controller-proof.json').read_text())
          assert c['segments']>=12 and c['cold']>0 and c['nativeCold']>0,c
          assert c['detachedLayoutObjects']>0 and c['zeroLayout']==c['nativeCold'],c
          m=json.loads((root/'BLINK_NATIVE_COLD.json').read_text())
          assert m['feature']=='LongViewSegmentLifecycle' and m['runtimeFeatureDefault']=='disabled',m
          for name in ('BROWSER_BINARY_SHA256.txt','PATCH_SHA256.txt','args.gn.resolved.txt','LONGVIEW_REPOSITORY_SHA.txt','VERSION.txt'):
              p=root/name;assert p.is_file() and p.stat().st_size>0,name
          PY
          target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${NATIVE_TAG}" --jq .target_commitish)"
          git fetch origin agent/blink-native-cold-alpha
          git merge-base --is-ancestor "$target" origin/agent/blink-native-cold-alpha
      - name: Merge PR 11
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr list --head agent/blink-native-cold-alpha --base main --state open --json number --jq '.[0].number')"
          test -n "$pr"
          gh pr comment "$pr" --body "The final-v5 full-source macOS build passed direct and controller-driven native COLD proofs. Release: **${NATIVE_TAG}**. Merging the Alpha."
          gh pr merge "$pr" --squash --subject 'Build the first Blink Native COLD macOS Alpha' --body 'Compile the pinned Chromium source with real LongView native COLD behavior and publish proof that descendant LayoutObjects are released and restored while geometry is retained.'
