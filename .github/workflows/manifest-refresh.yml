name: finalize-phase2-gate

on:
  push:
    branches: [agent/phase2-native-evidence]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make campaign ratio evaluation robust
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('benchmarks/runner/campaign-lib.mjs')
          source = path.read_text(encoding='utf-8')
          old = '  const ratios = largest.ratios || compareSummaries(largest.baseline.summary, largest.longview.summary);\n'
          new = '''  const ratios = {
            ...compareSummaries(largest.baseline.summary, largest.longview.summary),
            ...(largest.ratios || {})
          };
          '''
          if old not in source:
              raise SystemExit('campaign ratio block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python tools/generate_source_manifest.py
      - name: Commit final gate implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/runner/campaign-lib.mjs SOURCE_MANIFEST.sha256
          git commit -m 'fix: merge computed and supplied campaign ratios'
          git push origin HEAD:agent/phase2-native-evidence
