name: refresh-source-manifest

# This maintenance workflow is intentionally excluded from SOURCE_MANIFEST.sha256
# so it can safely retrigger checks after an Actions-authored manifest commit.
# Keep it content-neutral: it may change without invalidating the source manifest.
# A connector-authored change here is also the canonical final RC gate trigger.
on:
  push:
    branches: [main, "agent/**"]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-manifest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate exact source manifest
        run: python tools/generate_source_manifest.py
      - name: Commit manifest when workflows changed it
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- SOURCE_MANIFEST.sha256; then
            echo "SOURCE_MANIFEST.sha256 is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256
          git commit -m 'chore: refresh source manifest for workflows'
          git push origin HEAD:${GITHUB_REF_NAME}
