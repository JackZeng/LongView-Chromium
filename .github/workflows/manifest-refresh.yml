name: refresh-source-manifest

on:
  push:
    branches: [agent/phase2-native-evidence]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate source manifest
        run: python tools/generate_source_manifest.py
      - name: Commit exact manifest
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- SOURCE_MANIFEST.sha256; then
            echo 'Manifest already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256
          git commit -m 'chore: refresh source manifest for v0.2.0'
          git push origin HEAD:agent/phase2-native-evidence
