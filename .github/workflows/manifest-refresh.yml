name: finalize-phase2-sources

on:
  push:
    branches: [agent/phase2-native-evidence]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard benchmark CLI imports and regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('benchmarks/runner/runner.mjs')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'import { fileURLToPath } from "node:url";',
              'import { fileURLToPath, pathToFileURL } from "node:url";',
              1,
          )
          old = '''main().catch((error) => {
            console.error(error.stack || error);
            process.exitCode = 1;
          });
          '''
          new = '''const invokedPath = process.argv[1] ? pathToFileURL(path.resolve(process.argv[1])).href : null;
          if (invokedPath === import.meta.url) {
            main().catch((error) => {
              console.error(error.stack || error);
              process.exitCode = 1;
            });
          }
          '''
          if old not in source:
              raise SystemExit('runner entrypoint block not found')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8', newline='\n')
          PY
          python tools/generate_source_manifest.py
      - name: Commit final sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/runner/runner.mjs SOURCE_MANIFEST.sha256
          git commit -m 'fix: make benchmark runner safely importable'
          git push origin HEAD:agent/phase2-native-evidence
