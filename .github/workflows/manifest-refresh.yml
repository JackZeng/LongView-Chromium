name: refresh-smoke-wrapper-manifest

on:
  push:
    branches: [agent/phase2-native-evidence]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/generate_source_manifest.py
      - name: Commit source manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256
          git commit -m 'chore: refresh manifest after smoke wrapper fix'
          git push origin HEAD:agent/phase2-native-evidence
