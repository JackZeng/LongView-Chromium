name: evidence-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/**"
      - "product/extension/**"
      - "chromium.version"
      - ".github/workflows/evidence-smoke.yml"

permissions:
  contents: read

jobs:
  synthetic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read pinned Chromium version
        id: pin
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open("chromium.version"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install matching Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: "${{ steps.pin.outputs.version }}"
          install-dependencies: true
      - name: Create CI-only sandbox wrapper
        id: launcher
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          launcher="$RUNNER_TEMP/longview-chrome"
          cat > "$launcher" <<'EOF'
          #!/usr/bin/env bash
          exec "$CHROME_PATH" --no-sandbox "$@"
          EOF
          chmod +x "$launcher"
          echo "path=$launcher" >> "$GITHUB_OUTPUT"
      - name: Verify dependency-free CDP driver
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          xvfb-run -a node benchmarks/runner/driver-smoke.mjs "${{ steps.launcher.outputs.path }}"
      - name: Run two-scale baseline/LongView smoke campaign
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          xvfb-run -a node benchmarks/runner/campaign.mjs \
            --executable "${{ steps.launcher.outputs.path }}" \
            --turns 100,500 \
            --runs 1 \
            --duration 1800 \
            --stress \
            --outputDir benchmark-results/evidence-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: longview-evidence-smoke
          path: benchmark-results/evidence-smoke/**
          if-no-files-found: error
