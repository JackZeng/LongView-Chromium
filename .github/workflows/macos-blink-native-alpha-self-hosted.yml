name: macos-blink-native-alpha-self-hosted

on:
  workflow_dispatch:
  push:
    branches: ["agent/blink-native-cold-alpha"]
    paths:
      - "tools/ci/build_macos_blink_native_alpha_self_hosted.sh"
      - ".github/workflows/macos-blink-native-alpha-self-hosted.yml"

permissions:
  contents: write

concurrency:
  group: macos-blink-native-alpha-self-hosted
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, longview-macos]
    timeout-minutes: 720
    env:
      LONGVIEW_PERSISTENT_WORKSPACE: ${{ vars.LONGVIEW_PERSISTENT_WORKSPACE }}
      LONGVIEW_JOBS: ${{ vars.LONGVIEW_JOBS || '6' }}
      NINJA_SUMMARIZE_BUILD: "1"
      GOMA_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify persistent Apple Silicon host
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          df -h "${LONGVIEW_PERSISTENT_WORKSPACE:-$HOME/LongViewChromiumBuild}"
      - name: Build complete Chromium and both native proofs
        shell: bash
        run: bash tools/ci/build_macos_blink_native_alpha_self_hosted.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LongView-Chromium-macOS-Blink-Native-Alpha-self-hosted
          path: dist/macos-native-alpha-v4/**
          if-no-files-found: error
          retention-days: 30
      - name: Publish fixed proven native Alpha prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v0.4.0-blink-native-alpha.proven'
          version="$(cat dist/macos-native-alpha-v4/VERSION.txt)"
          gh release delete "$tag" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$tag" \
            dist/macos-native-alpha-v4/LongView-Chromium-macOS-arm64-Blink-Native-Alpha.zip \
            dist/macos-native-alpha-v4/SHA256SUMS.txt \
            dist/macos-native-alpha-v4/README-FIRST.txt \
            dist/macos-native-alpha-v4/VERSION.txt \
            dist/macos-native-alpha-v4/proof/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "LongView Chromium $version" \
            --notes "Full-source Apple Silicon Blink Native Alpha built on the persistent longview-macos runner. Direct and controller-driven native COLD proofs are attached. Ad-hoc signed and not notarized."
