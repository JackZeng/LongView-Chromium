name: fix-release-parser-once

on:
  push:
    branches: [agent/phase7-release-candidate]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch cross-platform artifact specification parser
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source_path = Path('tools/release/longview_release.py')
          source = source_path.read_text(encoding='utf-8')
          start = source.index('def parse_artifact_spec')
          end = source.index('\n\ndef build_manifest', start)
          replacement = dedent('''
          def split_artifact_spec(spec: str) -> tuple[str, str, str, str | None]:
              # platform:arch:path[:https://signature-url]
              # Only the two structural prefixes are split. This preserves
              # Windows drive letters, while the optional signature URL is
              # identified by its mandatory HTTPS scheme.
              parts = spec.split(":", 2)
              if len(parts) != 3:
                  raise ValueError("artifact must be platform:arch:path[:https://signature-url]")
              target_platform, arch, remainder = parts
              signature_match = re.search(r":(https://.+)$", remainder)
              if signature_match:
                  raw_path = remainder[:signature_match.start()]
                  signature_url = signature_match.group(1)
              else:
                  raw_path = remainder
                  signature_url = None
              if not raw_path:
                  raise ValueError("artifact path must not be empty")
              return target_platform, arch, raw_path, signature_url


          def parse_artifact_spec(spec: str, base_url: str) -> Artifact:
              target_platform, arch, raw_path, signature_url = split_artifact_spec(spec)
              path = Path(raw_path).resolve()
              if not path.is_file():
                  raise FileNotFoundError(path)
              filename = path.name
              url = f"{base_url.rstrip('/')}/{filename}"
              artifact = Artifact(
                  platform=target_platform,
                  arch=arch,
                  filename=filename,
                  url=url,
                  sha256=sha256_file(path),
                  size=path.stat().st_size,
                  signature_url=signature_url,
              )
              artifact.validate()
              return artifact
          ''').lstrip()
          source_path.write_text(source[:start] + replacement + source[end:], encoding='utf-8', newline='\n')

          test_path = Path('tools/release/test_release_tool.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '    def test_rollout_is_stable(self) -> None:\n'
          addition = (
              '    def test_artifact_spec_preserves_windows_drive_and_signature_url(self) -> None:\n'
              '        target_platform, arch, raw_path, signature_url = longview_release.split_artifact_spec(\n'
              '            r"windows:x64:C:\\\\release\\\\LongView.zip:https://updates.example.test:8443/LongView.zip.sig"\n'
              '        )\n'
              '        self.assertEqual(target_platform, "windows")\n'
              '        self.assertEqual(arch, "x64")\n'
              '        self.assertEqual(raw_path, r"C:\\\\release\\\\LongView.zip")\n'
              '        self.assertEqual(signature_url, "https://updates.example.test:8443/LongView.zip.sig")\n'
              '\n'
          )
          if 'test_artifact_spec_preserves_windows_drive_and_signature_url' not in tests:
              if marker not in tests:
                  raise SystemExit('release test insertion point changed')
              test_path.write_text(tests.replace(marker, addition + marker, 1), encoding='utf-8', newline='\n')
          PY
      - name: Validate release tools
        shell: bash
        run: |
          python -m py_compile tools/release/longview_release.py tools/release/test_release_tool.py
          PYTHONPATH=tools/release python -m unittest discover -s tools/release -p 'test_*.py' -v
      - name: Refresh manifest and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-release-parser-once.yml
          python tools/generate_source_manifest.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/release/longview_release.py tools/release/test_release_tool.py SOURCE_MANIFEST.sha256 .github/workflows/fix-release-parser-once.yml
          git commit -m 'fix: preserve Windows paths in release artifact specs'
          git push origin HEAD:agent/phase7-release-candidate
