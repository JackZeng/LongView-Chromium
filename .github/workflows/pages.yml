name: status-dashboard
on:
  push:
    branches: [main]
    paths: ["site/**", "branding/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/branding
          cp -R site/. _site/
          cp branding/longview.svg _site/branding/longview.svg
          sed -i 's#../branding/longview.svg#branding/longview.svg#' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
