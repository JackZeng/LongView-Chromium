name: refresh-manifest-once

on:
  push:
    branches: [agent/phase2-native-evidence]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate manifest and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-manifest-once.yml
          python tools/generate_source_manifest.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/refresh-manifest-once.yml SOURCE_MANIFEST.sha256
          git commit -m 'chore: refresh source manifest after smoke fix'
          git push origin HEAD:agent/phase2-native-evidence
