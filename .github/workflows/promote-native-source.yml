name: Promote native source tree

on:
  push:
    branches: [agent/native-chromium-v0.1.0]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_TREE: 6e9cc2442055c5e0d9e09e040014494352a0bc50
      MAIN_SHA: 4156fd6fb405acd6932af435ed18cc24e9982e61
      BRANCH: agent/native-chromium-v0.1.0
    steps:
      - uses: actions/checkout@v4
      - name: Build clean native commit from verified Git objects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          data = Path('.longview-bootstrap/final-segment-controller.js').read_bytes()
          Path('/tmp/blob.json').write_text(json.dumps({
              'content': base64.b64encode(data).decode(),
              'encoding': 'base64'
          }))
          PY
          blob_sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/blob.json --jq .sha)

          python3 - "$BASE_TREE" "$blob_sha" <<'PY'
          import json, sys
          base_tree, blob_sha = sys.argv[1:]
          payload = {
              'base_tree': base_tree,
              'tree': [
                  {'path': 'product/extension/content/30-segment-controller.js', 'mode': '100644', 'type': 'blob', 'sha': blob_sha},
                  {'path': '.longview-bootstrap/segment.b64.part0', 'sha': None},
                  {'path': '.longview-bootstrap/segment.b64.part1', 'sha': None},
                  {'path': '.longview-bootstrap/segment.b64.part2', 'sha': None},
                  {'path': '.longview-bootstrap/segment.b64.part3', 'sha': None},
                  {'path': 'SOURCE_MANIFEST.sha256', 'sha': None},
              ]
          }
          open('/tmp/tree.json', 'w').write(json.dumps(payload))
          PY
          tree_sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input /tmp/tree.json --jq .sha)

          python3 - "$tree_sha" "$MAIN_SHA" <<'PY'
          import json, sys
          tree_sha, parent = sys.argv[1:]
          open('/tmp/commit.json', 'w').write(json.dumps({
              'message': 'feat: ship native Chromium v0.1.0',
              'tree': tree_sha,
              'parents': [parent]
          }))
          PY
          commit_sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input /tmp/commit.json --jq .sha)

          python3 - "$commit_sha" <<'PY'
          import json, sys
          open('/tmp/ref.json', 'w').write(json.dumps({'sha': sys.argv[1], 'force': True}))
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" --input /tmp/ref.json
          echo "Promoted branch to $commit_sha"
