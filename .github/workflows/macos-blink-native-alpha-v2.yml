name: macos-blink-native-alpha-v2

on:
  push:
    branches: ["agent/blink-native-cold-alpha"]
    paths:
      - "tools/ci/build_macos_blink_native_alpha.sh"
      - ".github/workflows/macos-blink-native-alpha-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-blink-native-alpha-final
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360
    env:
      LONGVIEW_WORKSPACE: ${{ github.workspace }}/.longview-native-v2
      NINJA_SUMMARIZE_BUILD: "1"
      GOMA_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, prove, and package Blink Native Alpha
        shell: bash
        run: bash tools/ci/build_macos_blink_native_alpha.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LongView-Chromium-macOS-Blink-Native-Alpha
          path: dist/macos-native-alpha/**
          if-no-files-found: error
          retention-days: 30
      - name: Publish proof-carrying native Alpha prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat dist/macos-native-alpha/VERSION.txt)"
          tag="v$version"
          gh release create "$tag" \
            dist/macos-native-alpha/LongView-Chromium-macOS-arm64-Blink-Native-Alpha.zip \
            dist/macos-native-alpha/SHA256SUMS.txt \
            dist/macos-native-alpha/README-FIRST.txt \
            dist/macos-native-alpha/VERSION.txt \
            dist/macos-native-alpha/proof/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "LongView Chromium $version" \
            --notes "First full-source Apple Silicon Blink Native Alpha. Promotion requires the attached native proof to show LayoutObjects >0 before COLD, 0 after native detach, and >0 after materialization. Ad-hoc signed and not notarized."
