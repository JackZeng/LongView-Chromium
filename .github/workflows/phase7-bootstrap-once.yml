name: phase7-bootstrap-once

on:
  push:
    branches: [agent/phase7-release-candidate]

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reassemble, verify, and apply Phase 7 payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase7"
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          root = Path('.phase7-transport/chunks')
          names = [
              'chunk00',
              'chunk01a', 'chunk01b', 'chunk01c', 'chunk01d',
              'chunk02', 'chunk03', 'chunk04', 'chunk05', 'chunk06',
          ]
          chunks = [root / name for name in names]
          missing = [path.name for path in chunks if not path.is_file()]
          if missing:
              raise SystemExit(f'missing Phase 7 payload chunks: {missing}')
          encoded = b''.join(path.read_bytes() for path in chunks)
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected = 'fd1894376bf63769b3655b97e2884982dd648f6dbf96799171e900c8f80c4020'
          if digest != expected:
              raise SystemExit(f'Phase 7 payload SHA-256 mismatch: {digest} != {expected}')
          Path('/tmp/phase7-payload.tar.gz').write_bytes(archive)
          print(f'Verified Phase 7 payload: {len(archive)} bytes, {digest}')
          PY
          tar -xzf /tmp/phase7-payload.tar.gz -C "$RUNNER_TEMP/phase7"
          # Keep the real validation workflow only for the test workspace. The
          # connector installs all workflow files after the source commit lands.
          cp "$RUNNER_TEMP/phase7/payload/.github/workflows/phase7-validation.yml" "$RUNNER_TEMP/phase7-validation.yml"
          rm -rf "$RUNNER_TEMP/phase7/payload/.github/workflows"
          python - "$GITHUB_WORKSPACE" "$RUNNER_TEMP/phase7/payload" "$RUNNER_TEMP/phase7/apply.py" <<'PY'
          from pathlib import Path
          import runpy
          import sys

          repo = Path(sys.argv[1]).resolve()
          payload = Path(sys.argv[2]).resolve()
          apply_path = Path(sys.argv[3]).resolve()
          namespace = runpy.run_path(str(apply_path))

          def robust_update_cli(target_repo: Path) -> None:
              cli = target_repo / 'tools/longview_tools/cli.py'
              text = cli.read_text(encoding='utf-8')
              replacements = (
                  (
                      '    for target in ("//longview:segment_policy_test", "//longview:blink_feature_probe"): build(paths, profile, output, target)',
                      '    for target in ("//longview:segment_policy_test", "//longview:engine_contract_test", "//longview:blink_bridge_test", "//longview:blink_feature_probe"): build(paths, profile, output, target)',
                  ),
                  (
                      '    for executable in ("segment_policy_test", "blink_feature_probe"): run([built_target(paths.chromium_src, output, executable)], cwd=paths.chromium_src)',
                      '    for executable in ("segment_policy_test", "engine_contract_test", "blink_bridge_test", "blink_feature_probe"): run([built_target(paths.chromium_src, output, executable)], cwd=paths.chromium_src)',
                  ),
                  (
                      '"targets": ["segment_policy_test", "blink_feature_probe"]',
                      '"targets": ["segment_policy_test", "engine_contract_test", "blink_bridge_test", "blink_feature_probe"]',
                  ),
              )
              for old, new in replacements:
                  if old not in text:
                      raise RuntimeError(f'native_probe statement changed; refusing unsafe rewrite: {old}')
                  text = text.replace(old, new, 1)
              cli.write_text(text, encoding='utf-8', newline='\n')

          namespace['copy_payload'](payload, repo)
          namespace['update_versions'](repo)
          robust_update_cli(repo)
          namespace['update_validator'](repo)
          namespace['update_gitignore'](repo)
          print('Applied LongView 0.3.0 Phase 7 source payload')
          PY
          rm -rf .phase7-transport
          python tools/generate_source_manifest.py
          cp "$RUNNER_TEMP/phase7-validation.yml" .github/workflows/phase7-validation.yml
      - name: Validate repository and JavaScript
        shell: bash
        run: |
          python tools/validate_repository.py
          npm run check:js
          npm test
      - name: Validate Python tools
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: |
          python -m unittest discover -s tools/tests -v
          PYTHONPATH=tools/release python -m unittest discover -s tools/release -p 'test_*.py' -v
          python -m compileall -q tools
      - name: Validate native policy and engine contracts
        shell: bash
        run: |
          cmake -S src/native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel 2
          ctest --test-dir build/native --output-on-failure
          cmake -S src/engine -B build/engine -DCMAKE_BUILD_TYPE=Release
          cmake --build build/engine --parallel 2
          ctest --test-dir build/engine --output-on-failure
      - name: Commit promoted Phase 7 source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase7-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Phase 7 release candidate infrastructure'
          git push origin HEAD:agent/phase7-release-candidate
