name: native-cold-contract

on:
  push:
    branches: [main, "agent/**"]
    paths:
      - "tools/longview_tools/native_cold_patch.py"
      - "tools/install_blink_native_cold.py"
      - "patches/blink/0002-longview-native-cold-layout-detach.patch"
      - "patches/series.json"
      - "product/extension/content/35-native-cold.js"
      - "product/extension/tests/native-cold.test.mjs"
      - "product/extension/manifest.json"
      - ".github/workflows/native-cold-contract.yml"
  pull_request:
    paths:
      - "tools/longview_tools/native_cold_patch.py"
      - "tools/install_blink_native_cold.py"
      - "patches/blink/0002-longview-native-cold-layout-detach.patch"
      - "patches/series.json"
      - "product/extension/content/35-native-cold.js"
      - "product/extension/tests/native-cold.test.mjs"
      - "product/extension/manifest.json"
      - ".github/workflows/native-cold-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Python and runtime bridge tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/longview_tools/native_cold_patch.py tools/install_blink_native_cold.py
          node --check product/extension/content/35-native-cold.js
          node --test product/extension/tests/native-cold.test.mjs
      - name: Fetch exact pinned Blink source contract
        shell: bash
        run: |
          set -euo pipefail
          commit="$(python -c 'import json; print(json.load(open("chromium.version"))["commit"])')"
          root="$RUNNER_TEMP/chromium-src"
          mkdir -p "$root"
          files=(
            third_party/blink/renderer/platform/runtime_enabled_features.json5
            third_party/blink/renderer/core/dom/node.h
            third_party/blink/renderer/core/dom/node.cc
            third_party/blink/renderer/core/dom/element.h
            third_party/blink/renderer/core/dom/element.cc
            third_party/blink/renderer/core/dom/element.idl
          )
          for path in "${files[@]}"; do
            mkdir -p "$root/$(dirname "$path")"
            curl --fail --location --retry 3 \
              "https://chromium.googlesource.com/chromium/src/+/${commit}/${path}?format=TEXT" \
              | base64 --decode > "$root/$path"
          done
          git -C "$root" init -q
          git -C "$root" config user.name 'LongView Contract Test'
          git -C "$root" config user.email 'longview@example.invalid'
          git -C "$root" add .
          git -C "$root" commit -qm baseline
      - name: Recreate runtime-feature baseline and compare exact behavior patch
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/chromium-src"
          PYTHONPATH=tools python - <<'PY'
          from pathlib import Path
          from longview_tools.blink_patch import install_runtime_feature
          source = Path(__import__('os').environ['RUNNER_TEMP']) / 'chromium-src'
          install_runtime_feature(source / 'third_party/blink/renderer/platform/runtime_enabled_features.json5')
          PY
          git -C "$root" add third_party/blink/renderer/platform/runtime_enabled_features.json5
          git -C "$root" commit -qm runtime-feature
          PYTHONPATH=tools python tools/install_blink_native_cold.py \
            --source "$root" \
            --skip-pin-check \
            --metadata "$RUNNER_TEMP/native-cold.json" \
            --patch-output "$RUNNER_TEMP/generated.patch"
          test -s "$RUNNER_TEMP/generated.patch"
          test -s patches/blink/0002-longview-native-cold-layout-detach.patch
          cmp "$RUNNER_TEMP/generated.patch" patches/blink/0002-longview-native-cold-layout-detach.patch
          git -C "$root" diff --check
      - name: Verify patch digest and behavioral invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          series = json.loads(Path('patches/series.json').read_text())
          item = next(p for p in series['patches'] if p['id'] == 'blink-longview-native-cold-layout-detach')
          patch = Path('patches') / item['path']
          actual = hashlib.sha256(patch.read_bytes()).hexdigest()
          assert actual == item['sha256'], (actual, item['sha256'])
          text = patch.read_text(encoding='utf-8')
          required = [
              'longViewDetachDescendantLayoutObjects',
              'LongViewDetachLayoutTreeForCold',
              'SetForceReattachLayoutTree',
              'DetachLayoutTree',
              'RuntimeEnabledFeatures::LongViewSegmentLifecycleEnabled',
          ]
          for token in required:
              assert token in text, token
          assert item['renderingBehaviorChange'] is True
          assert item['enabledByDefault'] is False
          PY
