name: fix-native-alpha-wrapper-once

on:
  push:
    branches: ["agent/blink-native-cold-alpha"]
    paths:
      - ".github/workflows/fix-native-alpha-wrapper-once.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package the compiled browser behind a native launcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/ci/build_macos_blink_native_alpha.sh')
          text = path.read_text(encoding='utf-8')
          old_copy = 'cp -R "$out/Chromium.app" "$dist/LongView Chromium Native Alpha.app"\n'
          new_copy = '''export CHROMIUM_APP="$out/Chromium.app"\nexport OUTPUT_APP="$dist/LongView Chromium Native Alpha.app"\nexport LONGVIEW_VERSION="$version"\nbash tools/ci/package_macos_blink_native_alpha.sh\n'''
          if old_copy not in text:
              raise SystemExit('native app copy line changed unexpectedly')
          text = text.replace(old_copy, new_copy, 1)
          old_binary = 'binary="$dist/LongView Chromium Native Alpha.app/Contents/MacOS/Chromium"'
          new_binary = 'binary="$dist/LongView Chromium Native Alpha.app/Contents/Resources/Chromium.app/Contents/MacOS/Chromium"'
          if old_binary not in text:
              raise SystemExit('browser binary proof path changed unexpectedly')
          text = text.replace(old_binary, new_binary, 1)
          text = text.replace('codesign --force --deep --sign - --timestamp=none "$dist/LongView Chromium Native Alpha.app"\n', '')
          text = text.replace('codesign --verify --deep --strict --verbose=2 "$dist/LongView Chromium Native Alpha.app"\n', '')
          old_launch = '''Start with:\nopen -a "LongView Chromium Native Alpha" --args --enable-blink-features=LongViewSegmentLifecycle\n'''
          new_launch = '''Double-click "LongView Chromium Native Alpha.app". The native ARM64 launcher\nenables LongViewSegmentLifecycle and loads the bundled LongView runtime automatically.\n'''
          if old_launch not in text:
              raise SystemExit('README launch instructions changed unexpectedly')
          text = text.replace(old_launch, new_launch, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/fix-native-alpha-wrapper-once.yml
          python tools/generate_source_manifest.py
      - name: Validate packaging scripts
        shell: bash
        run: |
          bash -n tools/ci/build_macos_blink_native_alpha.sh
          bash -n tools/ci/package_macos_blink_native_alpha.sh
          python tools/validate_repository.py
      - name: Commit runnable native app packaging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: package the native Alpha with its LongView launcher'
          git push origin HEAD:agent/blink-native-cold-alpha
