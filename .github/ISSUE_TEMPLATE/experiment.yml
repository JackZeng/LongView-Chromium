name: Experiment
description: Propose a measurable LongView performance experiment
title: "[Experiment] "
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: State the mechanism and expected measurable outcome.
    validations:
      required: true
  - type: textarea
    id: workload
    attributes:
      label: Workload
      description: Which fixture, scale, and interaction will be tested?
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Success metrics
      description: Define before implementation so the experiment cannot move its goalposts.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility risks
      description: Which observable web behaviors could this change?
