<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LongView Conversation Benchmark</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="benchmark-header">
    <div>
      <strong>LongView Conversation Benchmark</strong>
      <span id="stats">Preparing…</span>
    </div>
    <div class="controls">
      <label for="target">Jump to</label>
      <select id="target"></select>
      <button id="run" type="button">Run scroll</button>
    </div>
  </header>
  <main id="conversation" class="conversation" aria-live="polite"></main>
  <script src="app.js"></script>
</body>
</html>
